name: Auto Filter Nodes
on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时在 GitHub 云端后台默默洗一次节点
  workflow_dispatch: # 支持手动点击运行

# 🔑 显式声明允许此工作流写入你的仓库，彻底解决 403 报错
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Run filter script
      run: python filter.py
      
    - name: Commit and Push to Repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sub_filtered.txt
        git commit -m "自动更新过滤节点" || exit 0
        git push
